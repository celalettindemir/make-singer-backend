name: Core Service CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "core-service/**"
      - ".github/workflows/core-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "core-service/**"
      - ".github/workflows/core-service.yml"

env:
  IMAGE_NAME: make-singer-backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./core-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ./core-service

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./core-service
    # Redis is REQUIRED for the OP (kimlik) tests: every test that goes
    # through muxKur -- the C1 account-takeover attack tests, all PKCE
    # /authorize tests, the discovery tests and the rate-limit mux test --
    # calls testRedis(t) and t.Skip()s without it. Without this service
    # those ~29 tests silently SKIPped in CI, which is why the test suite
    # never caught the live takeover. Tests look for localhost:6379 (DB 15)
    # and still skip (never fail) when Redis is absent locally.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./cmd/server

      - name: Vet
        run: go vet ./...

      - name: Unit testler
        run: go test ./internal/...

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./core-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
