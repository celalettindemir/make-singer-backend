server:
  port: "8000"
  env: "development"
  log_level: "info" # debug, info, warn, error

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

ratelimit:
  lyrics_per_min: 30
  render_per_hour: 5
  master_per_hour: 10
  export_per_hour: 20
  upload_per_hour: 50
  ws_ticket_per_min: 60
  sign_per_min: 60
  sosyal_yayin_per_hour: 30
  sosyal_yorum_per_min: 10 # 429 yavasla when exceeded
  sosyal_cover_per_hour: 20
  public_per_min: 30 # GET /api/public/s/{slug}, per client IP
  public_web_per_min: 600 # same endpoint, shared by all web requests carrying X-Web-Anahtari
  public_web_visitor_per_min: 30 # per visitor (X-Ziyaretci-Ip) within the web requests, also checked; <=0 disables
  purchases_per_min: 20 # RATELIMIT_PURCHASES_PER_MIN: POST /api/purchases/*, per user
  webhooks_per_min: 120 # RATELIMIT_WEBHOOKS_PER_MIN: store webhooks, per IP
  # Cloudflare edge ranges whose CF-Connecting-IP is trusted for per-IP limits (comma-separated CIDRs).
  # Unset = the built-in Cloudflare list (clientip.DefaultCloudflareRanges); empty string disables the header.
  # cloudflare_ranges: ""

# Discover (social)
sosyal:
  web_anahtari: "" # Set via SOSYAL_WEB_ANAHTARI (or _FILE). Empty = web bypass disabled.
  stale_preparation_after: 1h # SOCIAL_STALE_PREPARATION_AFTER: preparing longer than this -> failed
  stale_sweep_interval: 15m # SOCIAL_STALE_SWEEP_INTERVAL: sweep period; <= 0 disables the scheduler

# Credits
credits:
  enforce: false # CREDITS_ENFORCE: false = no deduction yet
  plan_plus: 300 # CREDITS_PLAN_PLUS: credits of each Plus plan lot
  plan_pro: 1000 # CREDITS_PLAN_PRO: credits of each Pro plan lot
  refund_grace: 168h # CREDITS_REFUND_GRACE: validity of the lot a refund into an expired lot creates
  expire_interval: 1h # CREDITS_EXPIRE_INTERVAL: lot expiry sweep period
  costs:
    render_mix: 12 # CREDITS_COST_RENDER_MIX
    render_focus: 32 # CREDITS_COST_RENDER_FOCUS
    render_stems: 62 # CREDITS_COST_RENDER_STEMS
    lyrics_generate: 2 # CREDITS_COST_LYRICS_GENERATE
    lyrics_rewrite: 1 # CREDITS_COST_LYRICS_REWRITE
    master: 3 # CREDITS_COST_MASTER
  refill_interval: 1h # CREDITS_REFILL_INTERVAL: annual-plan refill sweep period

# Apple App Store
appstore:
  bundle_id: "" # APPSTORE_BUNDLE_ID
  product_prefix: "" # APPSTORE_PRODUCT_PREFIX; empty = bundle_id + "."
  issuer_id: "" # APPSTORE_ISSUER_ID
  key_id: "" # APPSTORE_KEY_ID
  private_key: "" # APPSTORE_PRIVATE_KEY (or _FILE): secret, never in this file

# Google Play
googleplay:
  package_name: "" # GOOGLEPLAY_PACKAGE_NAME
  service_account: "" # GOOGLEPLAY_SERVICE_ACCOUNT (or _FILE): secret JSON, never in this file
  pubsub_audience: "" # GOOGLEPLAY_PUBSUB_AUDIENCE: expected OIDC audience of the RTDN push
  pubsub_email: "" # GOOGLEPLAY_PUBSUB_EMAIL: expected service account of the push

# Groq AI Configuration
groq:
  api_key: "" # Set via GROQ_API_KEY env var
  base_url: "https://api.groq.com/openai/v1"
  model: "openai/gpt-oss-120b"
  max_tokens: 4000
  temperature_generate: 0.8
  temperature_rewrite: 0.6

# Cloudflare R2 Storage Configuration
r2:
  account_id: "" # Set via R2_ACCOUNT_ID env var
  access_key_id: "" # Set via R2_ACCESS_KEY_ID env var
  secret_access_key: "" # Set via R2_SECRET_ACCESS_KEY env var
  public_bucket: "makeasinger-public"
  private_bucket: "makeasinger-private"
  public_url: "https://makesinger-cdn.celalettindemir.dev" # required; can be overridden by R2_PUBLIC_URL
  presign_ttl: "1h" # lifetime of presigned URLs for private objects

# Suno API Configuration
suno:
  api_key: "" # Set via SUNO_API_KEY env var
  base_url: "https://api.sunoapi.org"
  model: "V6"
  callback_url: "https://makesinger-api.celalettindemir.dev/suno/callback"

# Audio Processing Service Configuration
audio:
  service_url: "http://localhost:8084"
  timeout: 120 # seconds

# Custom OpenID Provider Configuration
# auth.issuer is required: the service does not start if it is empty (no legacy path).
# If the provider fails to start, the service exits with a fatal error (fail-closed).
auth:
  issuer: "" # Set via AUTH_ISSUER env var (e.g., https://makesinger-auth.celalettindemir.dev)
  port: "8001" # Second listener port for the OpenID Provider
  client_id: "" # Set via AUTH_CLIENT_ID env var (e.g., makesinger-mobil). MUST NOT be empty.
  db_url: "" # Set via AUTH_DB_URL env var. PostgreSQL DSN for user database.
  # RSA private key in PEM format (secret, never in this file)
  signing_key_pem: "" # Set via AUTH_SIGNING_KEY env var (secret from Kubernetes)
  # 32-byte encryption key (secret, never in this file)
  crypto_key: "" # Set via AUTH_CRYPTO_KEY env var (secret from Kubernetes)
  # Whitespace-separated redirect URIs (Set via AUTH_REDIRECT_URIS env var)
  redirect_uris: [] # Set via AUTH_REDIRECT_URIS env var
  access_ttl: "15m" # Set via AUTH_ACCESS_TTL env var
  refresh_ttl: "1440h" # Set via AUTH_REFRESH_TTL env var (default: 60 days)
  # NOTE: access_ttl / refresh_ttl must be values time.ParseDuration
  # understands ("15m", "1440h"). Viper does NOT fall back to the default
  # for an unparsable value such as "15min" or "60d" — it silently yields
  # 0s. identity.Start refuses to start on a non-positive TTL.
  # Rate limits for the OP listener's /giris and /kayit endpoints (GET
  # and POST). These run on a separate net/http listener, outside the
  # Fiber middleware chain, so internal/middleware/ratelimit.go never
  # sees them. GET pages are counted on SEPARATE keys from POST so that
  # opening the form does not consume the password-attempt budget.
  login_ip_per_min: 10 # Set via AUTH_LOGIN_IP_PER_MIN
  login_email_per_hour: 60 # Set via AUTH_LOGIN_EMAIL_PER_HOUR
  signup_ip_per_hour: 5 # Set via AUTH_SIGNUP_IP_PER_HOUR
  # Number of TRUSTED reverse proxies in front of the OP listener.
  # DEFAULT 0 = X-Forwarded-For is NEVER read, RemoteAddr is used. This is
  # the fail-safe side: with no proxy in front, a value of 1 would trust a
  # single-element forged X-Forwarded-For and an attacker could write a
  # different IP on every request, bypassing the IP rate limit entirely.
  # MUST be set EXPLICITLY to the real proxy count when deployed behind a
  # reverse proxy such as Traefik (Traefik only => 1).
  trusted_proxies: 0 # Set via AUTH_TRUSTED_PROXIES
