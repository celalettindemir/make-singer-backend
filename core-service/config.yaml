server:
  port: "8000"
  env: "development"
  log_level: "info" # debug, info, warn, error

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

jwt:
  secret: "your-super-secret-key-change-in-production"
  expiration: 24 # hours

ratelimit:
  lyrics_per_min: 30
  render_per_hour: 5
  master_per_hour: 10
  export_per_hour: 20
  upload_per_hour: 50

# Groq AI Configuration
groq:
  api_key: "" # Set via GROQ_API_KEY env var
  base_url: "https://api.groq.com/openai/v1"
  model: "llama-3.3-70b-versatile"

# Cloudflare R2 Storage Configuration
r2:
  account_id: "" # Set via R2_ACCOUNT_ID env var
  access_key_id: "" # Set via R2_ACCESS_KEY_ID env var
  secret_access_key: "" # Set via R2_SECRET_ACCESS_KEY env var
  public_bucket: "makeasinger-public"
  private_bucket: "makeasinger-private"
  public_url: "https://makesinger-cdn.celalettindemir.dev" # zorunlu; R2_PUBLIC_URL ile ezilebilir
  presign_ttl: "1h" # private nesneler icin presigned URL omru

# Zitadel OIDC Configuration
zitadel:
  domain: "" # Set via ZITADEL_DOMAIN env var
  client_id: "" # Set via ZITADEL_CLIENT_ID env var
  issuer: "" # Set via ZITADEL_ISSUER env var (e.g., https://your-tenant.zitadel.cloud)

# Suno API Configuration
suno:
  api_key: "" # Set via SUNO_API_KEY env var
  base_url: "https://api.sunoapi.org"

# Audio Processing Service Configuration
audio:
  service_url: "http://localhost:8084"
  timeout: 120 # seconds

# API Gateway Configuration
gateway:
  enabled: false # Set to true when running behind Traefik

# Custom OpenID Provider Configuration
# When auth.issuer is empty, the service falls back to legacy HMAC JWT verification (development only).
# When auth.issuer is set but the provider fails to start, the service exits with a fatal error (fail-closed).
auth:
  issuer: "" # Set via AUTH_ISSUER env var (e.g., https://makesinger-auth.celalettindemir.dev)
  port: "8001" # Second listener port for the OpenID Provider
  client_id: "" # Set via AUTH_CLIENT_ID env var (e.g., makesinger-mobil). MUST NOT be empty if issuer is set.
  db_url: "" # Set via AUTH_DB_URL env var. PostgreSQL DSN for user database.
  # RSA private key in PEM format (secret, never in this file)
  signing_key_pem: "" # Set via AUTH_SIGNING_KEY env var (secret from Kubernetes)
  # 32-byte encryption key (secret, never in this file)
  crypto_key: "" # Set via AUTH_CRYPTO_KEY env var (secret from Kubernetes)
  # Whitespace-separated redirect URIs (Set via AUTH_REDIRECT_URIS env var)
  redirect_uris: [] # Set via AUTH_REDIRECT_URIS env var
  access_ttl: "15m" # Set via AUTH_ACCESS_TTL env var
  refresh_ttl: "1440h" # Set via AUTH_REFRESH_TTL env var (default: 60 days)
