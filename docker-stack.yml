version: "3.8"

# =============================================================================
# PORTAINER ENVIRONMENT VARIABLES (set in Portainer UI):
# -----------------------------------------------------------------------------
# DOCKER_USER              - Docker Hub username
# API_IMAGE                - API image name (default: make-singer-backend)
# AUDIO_IMAGE              - Audio image name (default: make-singer-audio)
# API_VERSION              - API image tag (default: latest)
# AUDIO_VERSION            - Audio image tag (default: latest)
# API_DOMAIN               - API domain (default: makesinger-api.celalettindemir.dev)
# REDIS_HOST               - Redis host (default: redis) → combined as REDIS_ADDR
# REDIS_PORT               - Redis port (default: 6379) → combined as REDIS_ADDR
# REDIS_PASSWORD            - Redis password (optional)
# R2_PUBLIC_BUCKET         - R2 public bucket adi (default: makeasinger-public)
# R2_PRIVATE_BUCKET        - R2 private bucket adi (default: makeasinger-private)
# R2_PUBLIC_URL            - R2 CDN public URL (zorunlu, default: https://makesinger-cdn.celalettindemir.dev)
# GROQ_BASE_URL            - Groq API URL
# GROQ_MODEL               - Groq model
# SUNO_BASE_URL            - Suno API URL
# CORS_ORIGINS             - Allowed CORS origins (comma-separated)
# =============================================================================

services:
  # =============================================================================
  # API - Main Backend Service
  # =============================================================================
  api:
    image: ${DOCKER_USER}/${API_IMAGE:-make-singer-backend}:${API_VERSION:-latest}
    environment:
      SERVER_PORT: "8000"
      SERVER_ENV: production
      LOG_LEVEL: debug
      API_DOMAIN: ${API_DOMAIN:-makesinger-api.celalettindemir.dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      REDIS_ADDR: ${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      R2_ACCOUNT_ID_FILE: /run/secrets/r2_account_id
      R2_ACCESS_KEY_ID_FILE: /run/secrets/r2_access_key_id
      R2_SECRET_ACCESS_KEY_FILE: /run/secrets/r2_secret_access_key
      R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-makeasinger-public}
      R2_PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-makeasinger-private}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://makesinger-cdn.celalettindemir.dev}
      # Kendi OpenID Provider'imiz (zorunlu; bos ise api baslamaz).
      # Yerel Postgres ve anahtar uretimi icin bkz. core-service/.env.example.
      AUTH_ISSUER: ${AUTH_ISSUER}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID}
      AUTH_PORT: "8001"
      AUTH_DB_URL: ${AUTH_DB_URL}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY}
      AUTH_CRYPTO_KEY: ${AUTH_CRYPTO_KEY}
      SUNO_API_KEY_FILE: /run/secrets/suno_api_key
      SUNO_BASE_URL: ${SUNO_BASE_URL:-https://api.sunoapi.org}
      AUDIO_SERVICE_URL: http://audio-service:8084
      AUDIO_SERVICE_TIMEOUT: "120"
      # Kesfet web onizlemesi: make-singer-frontend'in X-Web-Anahtari degeri
      # (iki stack'te ayni). Bos ise web sunucusu da IP basina 30/dk sinirda.
      SOSYAL_WEB_ANAHTARI: ${SOSYAL_WEB_ANAHTARI:-}
      # Kredi: CREDITS_ENFORCE=false iken yalnizca olcum yapilir, kredi dusulmez.
      # 6b magazalarda yayinlanana kadar uretimde false kalir.
      CREDITS_ENFORCE: ${CREDITS_ENFORCE:-false}
      CREDITS_WELCOME: ${CREDITS_WELCOME:-24}
      CREDITS_PLAN_MONTHLY: ${CREDITS_PLAN_MONTHLY:-300}
      CREDITS_COST_RENDER_MIX: ${CREDITS_COST_RENDER_MIX:-12}
      CREDITS_COST_RENDER_FOCUS: ${CREDITS_COST_RENDER_FOCUS:-32}
      CREDITS_COST_RENDER_STEMS: ${CREDITS_COST_RENDER_STEMS:-62}
      CREDITS_COST_LYRICS_GENERATE: ${CREDITS_COST_LYRICS_GENERATE:-2}
      CREDITS_COST_LYRICS_REWRITE: ${CREDITS_COST_LYRICS_REWRITE:-1}
      CREDITS_REFILL_INTERVAL: ${CREDITS_REFILL_INTERVAL:-1h}
      APPSTORE_BUNDLE_ID: ${APPSTORE_BUNDLE_ID:-}
      APPSTORE_PRODUCT_PREFIX: ${APPSTORE_PRODUCT_PREFIX:-}
      APPSTORE_ISSUER_ID: ${APPSTORE_ISSUER_ID:-}
      APPSTORE_KEY_ID: ${APPSTORE_KEY_ID:-}
      APPSTORE_PRIVATE_KEY_FILE: /run/secrets/appstore_private_key
      GOOGLEPLAY_PACKAGE_NAME: ${GOOGLEPLAY_PACKAGE_NAME:-}
      GOOGLEPLAY_PUBSUB_AUDIENCE: ${GOOGLEPLAY_PUBSUB_AUDIENCE:-}
      GOOGLEPLAY_PUBSUB_EMAIL: ${GOOGLEPLAY_PUBSUB_EMAIL:-}
      GOOGLEPLAY_SERVICE_ACCOUNT_FILE: /run/secrets/googleplay_service_account
    secrets:
      - groq_api_key
      - appstore_private_key
      - googleplay_service_account
      - r2_account_id
      - r2_access_key_id
      - r2_secret_access_key
      - suno_api_key
    networks:
      - traefik-public
      - make-singer-backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"

        ## Middleware: Rate Limit
        - "traefik.http.middlewares.ms-rate-limit.ratelimit.average=100"
        - "traefik.http.middlewares.ms-rate-limit.ratelimit.burst=200"
        - "traefik.http.middlewares.ms-rate-limit.ratelimit.period=1s"

        ## Middleware: Security Headers
        - "traefik.http.middlewares.ms-secure-headers.headers.browserxssfilter=true"
        - "traefik.http.middlewares.ms-secure-headers.headers.contenttypenosniff=true"
        - "traefik.http.middlewares.ms-secure-headers.headers.framedeny=true"
        - "traefik.http.middlewares.ms-secure-headers.headers.stsincludesubdomains=true"
        - "traefik.http.middlewares.ms-secure-headers.headers.stspreload=true"
        - "traefik.http.middlewares.ms-secure-headers.headers.stsseconds=31536000"
        - "traefik.http.middlewares.ms-secure-headers.headers.customframeoptionsvalue=SAMEORIGIN"

        ## Router: Protected API routes
        - "traefik.http.routers.ms-api-protected.rule=Host(`${API_DOMAIN:-makesinger-api.celalettindemir.dev}`) && PathPrefix(`/api`)"
        - "traefik.http.routers.ms-api-protected.entrypoints=web"
        - "traefik.http.routers.ms-api-protected.middlewares=ms-rate-limit@docker,ms-secure-headers@docker"
        - "traefik.http.routers.ms-api-protected.service=ms-api-svc"

        ## Router: Public routes (health, swagger)
        - "traefik.http.routers.ms-api-public.rule=Host(`${API_DOMAIN:-makesinger-api.celalettindemir.dev}`) && (Path(`/health`) || PathPrefix(`/swagger`) || Path(`/`))"
        - "traefik.http.routers.ms-api-public.entrypoints=web"
        - "traefik.http.routers.ms-api-public.middlewares=ms-secure-headers@docker"
        - "traefik.http.routers.ms-api-public.service=ms-api-svc"

        ## Router: WebSocket
        - "traefik.http.routers.ms-api-ws.rule=Host(`${API_DOMAIN:-makesinger-api.celalettindemir.dev}`) && PathPrefix(`/ws`)"
        - "traefik.http.routers.ms-api-ws.entrypoints=web"
        - "traefik.http.routers.ms-api-ws.service=ms-api-svc"

        ## Service
        - "traefik.http.services.ms-api-svc.loadbalancer.server.port=8000"
        - "traefik.http.services.ms-api-svc.loadbalancer.sticky.cookie=true"
        - "traefik.http.services.ms-api-svc.loadbalancer.sticky.cookie.name=ms_api_sticky"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # =============================================================================
  # AUDIO SERVICE - Audio Processing (Python/FFmpeg)
  # =============================================================================
  audio-service:
    image: ${DOCKER_USER}/${AUDIO_IMAGE:-make-singer-audio}:${AUDIO_VERSION:-latest}
    environment:
      LOG_LEVEL: debug
      R2_ACCOUNT_ID_FILE: /run/secrets/r2_account_id
      R2_ACCESS_KEY_ID_FILE: /run/secrets/r2_access_key_id
      R2_SECRET_ACCESS_KEY_FILE: /run/secrets/r2_secret_access_key
      R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-makeasinger-public}
      R2_PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-makeasinger-private}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://makesinger-cdn.celalettindemir.dev}
    secrets:
      - r2_account_id
      - r2_access_key_id
      - r2_secret_access_key
    networks:
      - make-singer-backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      labels:
        - "traefik.enable=false"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  traefik-public:
    external: true
  make-singer-backend:
    external: true

# =============================================================================
# SECRETS - Create in Portainer: Secrets > Add secret
# =============================================================================
# API:    groq_api_key, suno_api_key, redis_password
# R2:     r2_account_id, r2_access_key_id, r2_secret_access_key
# Kredi:  appstore_private_key, googleplay_service_account
#         Create BOTH before the first deploy of this version: the stack is
#         rejected while an external secret is missing, and Swarm rejects empty
#         secret data, so use a non-empty placeholder (e.g. "unset") until the
#         store is configured. The integration stays off while
#         APPSTORE_BUNDLE_ID / GOOGLEPLAY_PACKAGE_NAME are empty.
# =============================================================================
secrets:
  groq_api_key:
    external: true
  appstore_private_key:
    external: true
  googleplay_service_account:
    external: true
  suno_api_key:
    external: true
  redis_password:
    external: true
  r2_account_id:
    external: true
  r2_access_key_id:
    external: true
  r2_secret_access_key:
    external: true
